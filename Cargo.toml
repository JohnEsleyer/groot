[package]
name = "groot"
version = "0.1.0"
edition = "2021"
description = "Groot: a fast-iteration game engine pairing Bevy with the GoScript embedded scripting VM"
# With two binaries this crate keeps plain `cargo run` launching the game demo.
default-run = "groot-demo"

# The `groot` CLI scaffolds, runs, and builds Groot projects:
#   groot new my-game
#   groot run
#   groot build
#   groot info
[[bin]]
name = "groot"
path = "src/bin/cli.rs"

# The game runtime demo: loads groot.toml and runs the scene.
[[bin]]
name = "groot-demo"
path = "src/main.rs"

[dependencies]
bevy = "0.13"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# GoScript scripting crate, fetched from the upstream GitHub repository.
# Local development of goscript happens in a sibling checkout and is pushed
# here; a published crates.io release can replace this once available.
goscript = { git = "https://github.com/johnesleyer/goscript", branch = "main" }

[profile.dev]
opt-level = 1