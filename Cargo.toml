[package]
name = "groot"
version = "0.1.0"
edition = "2021"
description = "Groot: a fast-iteration 2D/3D game engine pairing Bevy with the GoScript embedded scripting VM"
default-run = "groot-demo"

[[bin]]
name = "groot"
path = "src/bin/cli.rs"

[[bin]]
name = "groot-demo"
path = "src/main.rs"

[dependencies]
bevy = "0.13"
serde = { version = "1", features = ["derive"] }
ron = "0.8"

# GoScript scripting crate, fetched from the upstream GitHub repository.
goscript = { git = "https://github.com/johnesleyer/goscript", branch = "main" }

[profile.dev]
opt-level = 1
