[package]
name = "groot"
version = "0.1.0"
edition = "2021"
description = "Groot: a fast-iteration game engine pairing Bevy with the GoScript embedded scripting VM"

[dependencies]
bevy = "0.13"

# GoScript scripting crate. Uses a local path while `goscript` is unreleased.
# Switch to the published/git dependency once it exists:
# goscript = { git = "https://github.com/JohnEsleyer/goscript" }
goscript = { path = "../../015-goscript/goscript" }

[profile.dev]
opt-level = 1