[package]
name = "groot-host"
version = "0.2.0"
edition = "2021"
description = "Native winit + wgpu runner for Ube Groot components"

[[bin]]
name = "groot-host"
path = "src/main.rs"

[dependencies]
winit = { version = "0.29", features = ["rwh_06"] }
wgpu = "0.19"
raw-window-handle = "0.6"
wasmtime = { version = "29.0", features = ["component-model"] }
wasmtime-wasi = "29.0"
pollster = "0.3"
bytemuck = { version = "1.16", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
