[package]
name = "groot-monitor"
version = "0.2.0"
edition = "2021"
description = "Interactive terminal TUI inspector for a running Groot game (ratatui)"

[[bin]]
name = "groot-monitor"
path = "src/main.rs"

[dependencies]
ratatui     = "0.26"
crossterm   = { version = "0.27", features = ["event-stream"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
clap        = { version = "4", features = ["derive"] }
